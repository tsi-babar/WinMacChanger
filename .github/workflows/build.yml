name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore WinMacChanger.csproj

      - name: Build (Release, net48)
        run: dotnet build WinMacChanger.csproj -c Release --no-restore

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: WinMacChanger-exe
          path: bin/Release/net48/WinMacChanger.exe
          if-no-files-found: error

      - name: Publish GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: bin/Release/net48/WinMacChanger.exe
